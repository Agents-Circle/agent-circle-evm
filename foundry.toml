[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
# Paris rather than Cancun: nothing here needs transient storage, and Paris bytecode
# deploys unchanged across every EVM chain worth targeting.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
# VerifyDeploy reads the locked parameters back to compare them with the chain.
fs_permissions = [{ access = "read", path = "./params" }]

# Invariant suites are shallow locally so `forge test` stays quick, and deep in CI.
[profile.default.invariant]
runs = 32
depth = 100
fail_on_revert = false

[profile.ci]
fuzz = { runs = 5000 }
invariant = { runs = 256, depth = 500, fail_on_revert = false }
verbosity = 3

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

[rpc_endpoints]
polygon = "${POLYGON_RPC_URL}"
amoy = "${AMOY_RPC_URL}"

[etherscan]
polygon = { key = "${POLYGONSCAN_API_KEY}", chain = 137 }
amoy = { key = "${POLYGONSCAN_API_KEY}", chain = 80002 }
