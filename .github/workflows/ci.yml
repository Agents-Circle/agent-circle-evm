name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Format check
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      - name: Coverage
        # --ir-minimum because coverage disables the optimizer, and the generated getter
        # for the twelve-field Vault struct goes stack-too-deep without it.
        run: forge coverage --ir-minimum --no-match-coverage "(test|script)"

  # Slither over `src/` only. Report-only for now: the first run's findings have not been
  # triaged, and a gate nobody has calibrated is one people learn to override. Findings
  # land in the repository's Security tab as SARIF. Once the baseline is triaged —
  # each finding fixed or recorded with a reason in docs/known-issues — change `fail-on`
  # to `medium`, so a new finding fails the build.
  static-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Slither
        id: slither
        uses: crytic/slither-action@v0.4.1
        with:
          fail-on: none
          slither-config: slither.config.json
          sarif: results.sarif

      - name: Upload findings
        if: always() && steps.slither.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}

      # Report-only, and staying so until this passes. The first baseline called
      # immutables "never initialized" and constants used in `placeOrder` "never used",
      # which means Slither's model had lost writes and internal calls — the order path's
      # limit checks among them — and a clean result from it would not be one. `docs/static-analysis.md`
      # has the triage. When this step reports no contradictions, set `fail-on: medium`.
      - name: Check Slither saw the code it reports on
        if: always() && steps.slither.outputs.sarif != ''
        run: |
          if ! python3 script/slither-coverage.py "${{ steps.slither.outputs.sarif }}" | tee coverage.txt; then
            echo "::warning title=Slither coverage::Slither's findings contradict the source; see the step log and docs/static-analysis.md"
            { echo '### Slither coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Which functions Slither actually modelled, for finding what it drops. A function
      # whose summary shows no state written (a constructor, `placeOrder`) is one it lost.
      - name: Slither function summary (diagnostic)
        if: always()
        uses: crytic/slither-action@v0.4.1
        continue-on-error: true
        with:
          fail-on: none
          slither-config: slither.config.json
          slither-args: --print function-summary --include-paths "src/hyperliquid/HLAgentVault.sol|src/AgentRegistry.sol"

  # Aderyn, the second analyser in plans/security-readiness.md §3. Report-only like
  # Slither until its baseline is triaged into docs/static-analysis.md; the report is
  # kept as an artifact rather than uploaded as code-scanning alerts.
  aderyn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Aderyn
        continue-on-error: true
        run: |
          npm install --global @cyfrin/aderyn
          aderyn --version
          aderyn . --src src --output aderyn-report.md
          { echo '### Aderyn'; head -c 60000 aderyn-report.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aderyn-report
          path: aderyn-report.md
          if-no-files-found: warn

  # The locked launch parameters are written out four times — JSON, Solidity, Anchor,
  # docs. This fails the build when any of them disagree. Its own job so that parameter
  # drift reads as parameter drift in the checks list, rather than as a test failure.
  params:
    runs-on: ubuntu-latest
    steps:
      # Checked out into a named directory rather than the workspace root, so the other
      # two repos can sit beside it as siblings — which is the layout the checker already
      # expects on a developer's machine. `actions/checkout` refuses any path outside the
      # workspace, so `../` from the root is not available.
      - uses: actions/checkout@v4
        with:
          path: agent-circle-evm

      # Each sibling is tried at the *same branch name* first, then at its default
      # branch. A parameter change nearly always spans repositories — the number moves in
      # Solidity, in Anchor and in the docs together — so comparing a feature branch here
      # against `main` there would report drift that the merge resolves, and would make
      # the check something people learn to ignore. Matching branch names is how the three
      # halves of one change find each other.
      #
      # Neither checkout may fail the job: the checker falls back to raw GitHub by itself,
      # and a genuinely missing file is reported as drift rather than as a broken runner.
      - id: programs_branch
        uses: actions/checkout@v4
        with:
          repository: Agents-Circle/agent-circle-programs
          ref: ${{ github.head_ref || github.ref_name }}
          path: agent-circle-programs
        continue-on-error: true

      - if: steps.programs_branch.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: Agents-Circle/agent-circle-programs
          path: agent-circle-programs
        continue-on-error: true

      - id: docs_branch
        uses: actions/checkout@v4
        with:
          repository: Agents-Circle/mintlify-docs
          ref: ${{ github.head_ref || github.ref_name }}
          path: mintlify-docs
        continue-on-error: true

      - if: steps.docs_branch.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: Agents-Circle/mintlify-docs
          path: mintlify-docs
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check locked parameters
        working-directory: agent-circle-evm
        run: python3 script/check-params.py
